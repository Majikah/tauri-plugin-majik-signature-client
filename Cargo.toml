[package]
name = "tauri-plugin-majik-signature-client"
version = "1.5.1"
edition = "2021"
rust-version = "1.92"
description = "Tauri v2 plugin exposing Majikah's Rust signature client to webview applications."
license = "Apache-2.0"
links = "tauri-plugin-majik-signature-client"
readme = "README.md"
authors = ["Majikah Solutions OPC"]
keywords = ["tauri", "tauri-plugin", "cryptography", "signatures", "majikah"]
categories = ["gui", "cryptography"]
include = [
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "PUBLISHING.md",
    "build.rs",
    "gen.py",
    "src/**/*.rs",
    "permissions/**/*.toml",
    "permissions/**/*.md",
    "permissions/**/*.json",
    "contract/commands.json",
    "tests/*.py",
]

[dependencies]
majik-signature-client = "1.5.1"
tauri = "2.12.7"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
zeroize = { version = "1.9.2", features = ["serde"] }
sysinfo = "=0.38.4"

[build-dependencies]
tauri-plugin = { version = "2.7.4", features = ["build"] }
