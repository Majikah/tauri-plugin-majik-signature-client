[package]
name = "tauri-plugin-majik-signature-client"
version = "1.6.0"
edition = "2021"
rust-version = "1.95"
description = "Tauri v2 plugin exposing Majikah's Rust signature client to webview applications."
license = "Apache-2.0"
links = "tauri-plugin-majik-signature-client"
readme = "README.md"
authors = ["Majikah Solutions OPC"]
keywords = ["tauri", "tauri-plugin", "cryptography", "signatures", "majikah"]
categories = ["gui", "cryptography"]
include = [
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "PUBLISHING.md",
    "SECURITY.md",
    "build.rs",
    "gen.py",
    "src/**/*.rs",
    "permissions/**/*.toml",
    "permissions/**/*.md",
    "permissions/**/*.json",
    "contract/commands.json",
    "tests/*.py",
]

[dependencies]
majik-signature-client = "1.6.0"
tauri = "2.12.7"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
zeroize = { version = "1.9.2", features = ["serde"] }
sysinfo = "=0.40.4"

[build-dependencies]
tauri-plugin = { version = "2.7.4", features = ["build"] }

# Development/CI override while the 1.6.0 client is not yet on crates.io.
# Cargo excludes this patch table from the packaged plugin manifest.
[patch.crates-io]
majik-signature-client = { git = "https://github.com/Majikah/majik-signature-client-rs", rev = "26371f08f9fea236386652d4ca6018d86fa5e6f2" }
